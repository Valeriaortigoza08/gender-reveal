<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Gran Sorpresa</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#ffd6e7,#fff3d6);
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.container{
    padding:30px;
    z-index:2;
}

.gift{
    font-size:120px;
    animation:bounce 2s infinite;
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
}

h1{
    color:#555;
    margin:20px 0;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:40px;
    background:#ff5e8a;
    color:white;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

button:hover{
    transform:scale(1.05);
}

#reveal{
    display:none;
}

.baby{
    font-size:120px;
    animation:pop 1s ease;
}

@keyframes pop{
    from{
        transform:scale(0);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.reveal-title{
    color:#1f7cff;
    font-size:55px;
    margin:15px 0;
    font-weight:bold;
}

.reveal-text{
    color:#333;
    font-size:24px;
    line-height:1.5;
}

.confetti{
    position:absolute;
    width:12px;
    height:12px;
    top:-20px;
    border-radius:2px;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container" id="giftScreen">

    <div class="gift">🎁</div>

    <h1>Tenemos una sorpresa muy especial...</h1>

    <p style="margin-bottom:20px;">
        Haz clic para descubrir si es niño o niña
    </p>

    <button onclick="revelarGenero()">
        Descubrir
    </button>

</div>

<div class="container" id="reveal">

    <div class="baby">👶💙</div>

    <div class="reveal-title">
        ¡ES NIÑO!
    </div>

    <div class="reveal-text">
        Nuestro pequeño príncipe viene en camino 💙<br><br>
        Estamos muy felices de compartir esta noticia contigo.
    </div>

</div>

<script>

function revelarGenero(){

    document.getElementById("giftScreen").style.display="none";
    document.getElementById("reveal").style.display="block";

    for(let i=0;i<200;i++){

        let confetti=document.createElement("div");

        confetti.classList.add("confetti");

        confetti.style.left=Math.random()*100+"vw";

        confetti.style.backgroundColor=
        ["#1f7cff","#62b0ff","#8ed1ff","#ffffff"][
            Math.floor(Math.random()*4)
        ];

        confetti.style.animationDuration=
        (Math.random()*3+2)+"s";

        document.body.appendChild(confetti);

        setTimeout(()=>{
            confetti.remove();
        },5000);
    }
}
</script>

</body>
</html>
